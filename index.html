<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Evita que o navegador guarde uma cópia antiga desta página em cache.
         Sem isso, depois de um deploy novo, quem já tinha aberto o site
         pode navegar usando uma versão velha do HTML que aponta pra
         arquivos JS que não existem mais, resultando em tela branca. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Paraíso Outlet - Tênis, Maquiagem e Roupas com os Melhores Preços</title>
    <meta name="description" content="Paraíso Outlet: tênis, maquiagem, cosméticos e roupas com os melhores preços. Compre pelo site e finalize seu pedido pelo WhatsApp." />
    <meta property="og:title" content="Paraíso Outlet" />
    <meta property="og:description" content="Tênis, maquiagem, cosméticos e roupas com os melhores preços." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/favicon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
